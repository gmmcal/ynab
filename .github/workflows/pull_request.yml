name: Pipeline

on:
  - pull_request

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # DOCKER
  build:
    name: Build Image
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v1
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      name: Test
      image: "gmmcal/ynab:test-${{ github.event.number }}-${{ github.run_number }}"

  development:
    name: Build Image
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v1
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      name: Development
      target: development
      publish: false
      image: gmmcal/ynab:development

  production:
    name: Build Image
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v1
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      name: Production
      target: production
      publish: false
      image: gmmcal/ynab:production

  # LINT
  rubocop:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Rubocop
      ruby-version: "4.0.7"
      command: bin/rubocop

  reek:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Reek
      ruby-version: "4.0.7"
      command: bundle exec reek --config .reek.yml 1

  brakeman:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Brakeman
      ruby-version: "4.0.7"
      command: bin/brakeman

  bundler-audit:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Bundler Audit
      ruby-version: "4.0.7"
      command: bundle exec bundle-audit check --update

  # TESTS
  tests:
    name: Tests
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_tests.yml@v2
    with:
      ruby-version: "4.0.7"
      command: bundle exec rails test
      migration-command: bundle exec rails db:migrate
      database-name: ynab_test
